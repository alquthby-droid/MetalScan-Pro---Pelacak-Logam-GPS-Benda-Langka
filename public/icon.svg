<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for standard icon -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Compass Dial Outer Ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#1e293b" stroke-width="12"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8 12" opacity="0.6"/>

  <!-- Radar / Detector Concentric Pulse Rings -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="84" fill="none" stroke="#eab308" stroke-width="4" opacity="0.5"/>

  <!-- Compass Cardinal Tick Marks -->
  <line x1="256" y1="74" x2="256" y2="98" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="414" x2="256" y2="438" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="74" y1="256" x2="98" y2="256" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="414" y1="256" x2="438" y2="256" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- Compass North Letter -->
  <text x="256" y="64" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle">N</text>

  <!-- Dual Compass Needle (North in Cyan/Gold, South in Slate) -->
  <!-- North Arrow -->
  <polygon points="256,108 284,256 256,236" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <polygon points="256,108 228,256 256,236" fill="#0284c7"/>

  <!-- South Arrow -->
  <polygon points="256,404 284,256 256,276" fill="#475569"/>
  <polygon points="256,404 228,256 256,276" fill="#334155"/>

  <!-- Metal Detector Target Center Star / Gem -->
  <circle cx="256" cy="256" r="32" fill="#090d16" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="256" cy="256" r="16" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Subtle crosshairs -->
  <line x1="220" y1="256" x2="292" y2="256" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="256" y1="220" x2="256" y2="292" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
</svg>
